<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניתוח — WeakPoint AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0B0B0A; --surface: #141413; --surface2: #1C1C1A;
      --border: #252523; --border2: #333330;
      --text: #EDE9E1; --text2: #8A8882; --text3: #4A4A47;
      --red: #D63030; --red-dim: #1E0A0A; --red-mid: #5A1A1A;
      --amber: #C9891A; --amber-dim: #1A1200;
      --green: #2A8A4A; --green-dim: #0A1A10;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; }

    nav { border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); }
    .logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: none; color: var(--text); }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px var(--red); }
    .nav-back { font-size: 13px; color: var(--text3); text-decoration: none; }
    .nav-back:hover { color: var(--text2); }

    .content { max-width: 680px; margin: 0 auto; padding: 40px 24px 80px; }

    /* FORM */
    .hero { margin-bottom: 40px; }
    .hero h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .hero h1 span { color: var(--red); }
    .hero p { font-size: 14px; color: var(--text2); line-height: 1.65; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .req { color: var(--red); }
    textarea, input[type=text] { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s; line-height: 1.6; resize: vertical; direction: rtl; }
    textarea:focus, input[type=text]:focus { border-color: var(--border2); }
    textarea::placeholder, input::placeholder { color: var(--text3); }

    .btn-primary { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 13px 24px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 8px; transition: opacity 0.15s; }
    .btn-primary:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { opacity: 0.88; }

    .error-box { background: var(--red-dim); border: 1px solid var(--red-mid); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 12px; }

    /* LOADING */
    .loading { text-align: center; padding: 60px 0; }
    .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; }
    .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
    .loading p { font-size: 14px; color: var(--text3); }

    /* REPORT */
    .report-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .report-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
    .report-meta-text { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }

    .prob-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 32px; }
    .prob-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .prob-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
    .prob-num { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .prob-track { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 14px; }
    .prob-fill { height: 100%; border-radius: 2px; }
    .verdict { font-size: 13px; color: var(--text2); line-height: 1.65; }

    .section-block { margin-bottom: 28px; }
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .section-bar { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }
    .section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }

    .risk-item { border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
    .risk-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .risk-badge { font-size: 10px; font-weight: 500; border-radius: 4px; padding: 2px 7px; border: 1px solid; }
    .risk-name { font-size: 13px; font-weight: 500; }
    .risk-desc { font-size: 12px; color: var(--text2); line-height: 1.65; }

    .text-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-size: 13px; color: var(--text2); line-height: 1.7; }
    .fix-item { display: flex; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--text2); line-height: 1.65; }
    .fix-num { font-weight: 600; flex-shrink: 0; color: var(--green); }

    .one-thing { background: var(--amber-dim); border: 1px solid var(--amber); border-radius: 10px; padding: 16px 20px; margin-bottom: 32px; }
    .one-thing-label { font-size: 10px; color: var(--amber); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; }
    .one-thing-text { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.6; }

    .btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: 8px; padding: 10px 20px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .btn-reset:hover { border-color: var(--border2); color: var(--text); }

    .share-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .share-text { font-size: 13px; color: var(--text2); }
    .share-btn { background: var(--red); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .btn-pdf { width: 100%; background: var(--surface); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 12px 24px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: border-color 0.15s; }
    .btn-pdf:hover { border-color: var(--text2); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <div class="logo-dot"></div>
      WeakPoint AI
    </a>
    <a href="index.html" class="nav-back">← חזרה</a>
  </nav>

  <div class="content">
    <div id="app"></div>
  </div>

  <script>
    const SEV = {
      1: { bg:'#1A1500', border:'#C9891A', text:'#C9891A', label:'בינוני' },
      2: { bg:'#1A0F05', border:'#B05528', text:'#B05528', label:'גבוה' },
      3: { bg:'#1E0A0A', border:'#D63030', text:'#D63030', label:'קריטי' }
    };

    let state = { view:'form', form:{ idea:'', market:'', revenue:'', resources:'', timeline:'' }, result:null, error:null };

    function render() {
      const app = document.getElementById('app');
      if (state.view === 'loading') {
        app.innerHTML = `<div class="loading"><div class="dots"><span></span><span></span><span></span></div><p>מנתח את נקודות התורפה שלך...<br><span style="font-size:12px">זה עשוי לקחת כ-20 שניות</span></p></div>`;
        return;
      }
      if (state.view === 'result' && state.result) {
        renderReport(app);
        return;
      }
      renderForm(app);
    }

    function renderForm(app) {
      const f = state.form;
      app.innerHTML = `
        <div class="hero">
          <h1>נתח את הרעיון שלך — <span>גלה את נקודות התורפה</span></h1>
          <p>מלא את הפרטים הבאים וה-AI ינתח את הסיכונות הקריטיים, תרחיש הכישלון, ומה לעשות עכשיו.</p>
        </div>
        ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
        <div class="form-group">
          <label>הרעיון העסקי <span class="req">*</span></label>
          <textarea id="f-idea" rows="4" placeholder="תאר את הרעיון, המוצר או השירות שלך...">${f.idea}</textarea>
        </div>
        <div class="form-group">
          <label>שוק יעד</label>
          <input type="text" id="f-market" placeholder="מי הלקוח? גיל, פרופיל, גודל שוק..." value="${f.market}">
        </div>
        <div class="form-group">
          <label>מודל הכנסות</label>
          <input type="text" id="f-revenue" placeholder="מנוי חודשי? עמלה? חד פעמי?" value="${f.revenue}">
        </div>
        <div class="form-group">
          <label>משאבים ותקציב</label>
          <input type="text" id="f-resources" placeholder="כמה כסף, זמן ואנשים יש לך..." value="${f.resources}">
        </div>
        <div class="form-group">
          <label>ציר זמן</label>
          <input type="text" id="f-timeline" placeholder="מתי רוצה להשיק? מטרות ל-6 חודשים..." value="${f.timeline}">
        </div>
        <button class="btn-primary" id="btn-go" onclick="runAnalysis()">נתח את הרעיון ←</button>
      `;
      ['idea','market','revenue','resources','timeline'].forEach(k => {
        const el = document.getElementById('f-' + k);
        if (el) el.addEventListener('input', e => { state.form[k] = e.target.value; updateBtn(); });
      });
      updateBtn();
    }

    function renderReport(app) {
      const r = state.result;
      const pct = r.failure_probability || 0;
      const col = pct >= 70 ? '#D63030' : pct >= 40 ? '#C9891A' : '#2A8A4A';

      const risks = (r.fatal_risks || []).map(risk => {
        const s = SEV[risk.severity] || SEV[1];
        return `<div class="risk-item" style="background:${s.bg};border:1px solid ${s.border}">
          <div class="risk-top">
            <span class="risk-badge" style="color:${s.text};border-color:${s.border}">${s.label}</span>
            <span class="risk-name">${risk.title}</span>
          </div>
          <div class="risk-desc">${risk.explanation}</div>
        </div>`;
      }).join('');

      const fixes = (r.critical_fixes || []).map((fix, i) =>
        `<div class="fix-item"><span class="fix-num">${i+1}.</span><span>${fix}</span></div>`
      ).join('');

      app.innerHTML = `
        <div class="report-meta">
          <div class="report-dot"></div>
          <span class="report-meta-text">דוח WeakPoint AI · ${new Date().toLocaleDateString('he-IL')}</span>
        </div>

        <div class="prob-card">
          <div class="prob-row">
            <div class="prob-label">הסתברות כישלון</div>
            <div class="prob-num" style="color:${col}">${pct}%</div>
          </div>
          <div class="prob-track"><div class="prob-fill" style="width:${pct}%;background:${col}"></div></div>
          <div class="verdict">${r.verdict || ''}</div>
        </div>

        <div class="section-block">
          <div class="section-head">
            <div class="section-bar" style="background:#D63030"></div>
            <span class="section-title" style="color:#D63030">סיכונות קריטיים</span>
          </div>
          ${risks}
        </div>

        <div class="section-block">
          <div class="section-head">
            <div class="section-bar" style="background:#C9891A"></div>
            <span class="section-title" style="color:#C9891A">תרחיש הכישלון הסביר ביותר</span>
          </div>
          <div class="text-block">${r.failure_scenario || ''}</div>
        </div>

        <div class="section-block">
          <div class="section-head">
            <div class="section-bar" style="background:#5A5A57"></div>
            <span class="section-title" style="color:#7A7873">מה המתחרים יעשו</span>
          </div>
          <div class="text-block">${r.competitor_response || ''}</div>
        </div>

        <div class="section-block">
          <div class="section-head">
            <div class="section-bar" style="background:#2A8A4A"></div>
            <span class="section-title" style="color:#2A8A4A">מה לתקן עכשיו</span>
          </div>
          ${fixes}
        </div>

        <div class="one-thing">
          <div class="one-thing-label">הדבר האחד הכי חשוב</div>
          <div class="one-thing-text">${r.one_thing || ''}</div>
        </div>

        <div class="share-box">
          <span class="share-text">הניתוח הזה היה שימושי? שתף עם יזם שצריך לשמוע אמת.</span>
          <button class="share-btn" onclick="shareReport()">שתף את WeakPoint AI</button>
        </div>

        <button class="btn-pdf" onclick="downloadPDF()">⬇ הורד דוח PDF</button>
        <button class="btn-reset" onclick="resetForm()">ניתוח חדש</button>
      `;
    }

    function updateBtn() {
      const btn = document.getElementById('btn-go');
      if (btn) btn.disabled = !state.form.idea.trim();
    }

    function resetForm() {
      state = { view:'form', form:{ idea:'', market:'', revenue:'', resources:'', timeline:'' }, result:null, error:null };
      render();
    }

    function shareReport() {
      if (navigator.share) {
        navigator.share({ title: 'WeakPoint AI', text: 'גלה את נקודות התורפה של הרעיון העסקי שלך', url: window.location.origin });
      } else {
        navigator.clipboard.writeText(window.location.origin).then(() => alert('הקישור הועתק!'));
      }
    }

    function downloadPDF() {
      const r = state.result;
      if (!r) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      const pageW = 210;
      const margin = 20;
      const maxW = pageW - margin * 2;
      let y = 20;

      const addText = (text, size, color, bold, indent) => {
        doc.setFontSize(size);
        doc.setTextColor(...color);
        doc.setFont('helvetica', bold ? 'bold' : 'normal');
        const lines = doc.splitTextToSize(text, maxW - (indent || 0));
        lines.forEach(line => {
          if (y > 270) { doc.addPage(); y = 20; }
          doc.text(line, margin + (indent || 0), y);
          y += size * 0.45;
        });
        y += 2;
      };

      const addLine = () => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.setDrawColor(50, 50, 48);
        doc.line(margin, y, pageW - margin, y);
        y += 6;
      };

      // Header
      doc.setFillColor(211, 48, 48);
      doc.rect(0, 0, pageW, 12, 'F');
      doc.setFontSize(9); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold');
      doc.text('WeakPoint AI — Business Failure Analysis Report', margin, 8);
      doc.text(new Date().toLocaleDateString('he-IL'), pageW - margin, 8, { align: 'right' });
      y = 24;

      // Failure probability
      addText(`Failure Probability: ${r.failure_probability}%`, 22, [211,48,48], true);
      addText(r.verdict || '', 10, [138,136,130], false);
      y += 4; addLine();

      // Risks
      addText('CRITICAL RISKS', 11, [211,48,48], true);
      y += 2;
      (r.fatal_risks || []).forEach((risk, i) => {
        const sevLabel = risk.severity === 3 ? 'CRITICAL' : risk.severity === 2 ? 'HIGH' : 'MEDIUM';
        addText(`${i+1}. [${sevLabel}] ${risk.title}`, 10, [237,233,225], true);
        addText(risk.explanation, 9, [138,136,130], false, 4);
        y += 2;
      });
      addLine();

      // Failure scenario
      addText('MOST LIKELY FAILURE SCENARIO', 11, [201,137,26], true);
      y += 2;
      addText(r.failure_scenario || '', 10, [138,136,130], false);
      y += 2; addLine();

      // Competitor response
      addText('WHAT COMPETITORS WILL DO', 11, [90,90,87], true);
      y += 2;
      addText(r.competitor_response || '', 10, [138,136,130], false);
      y += 2; addLine();

      // Fixes
      addText('CRITICAL FIXES', 11, [42,138,74], true);
      y += 2;
      (r.critical_fixes || []).forEach((fix, i) => {
        addText(`${i+1}. ${fix}`, 10, [138,136,130], false);
      });
      y += 2; addLine();

      // One thing
      addText('THE ONE MOST IMPORTANT THING', 11, [201,137,26], true);
      y += 2;
      addText(r.one_thing || '', 11, [237,233,225], true);

      // Footer
      doc.setFontSize(8); doc.setTextColor(74,74,71);
      doc.text('Generated by WeakPoint AI — weakpoint-ai.netlify.app', margin, 290);

      doc.save(`weakpoint-analysis-${Date.now()}.pdf`);
    }

    async function runAnalysis() {
      if (!state.form.idea.trim()) return;
      state.view = 'loading'; state.error = null; state.result = null;
      render();

      const f = state.form;
      const userPrompt = `נתח עסק. ענה JSON בלבד, ללא markdown.
רעיון: ${f.idea}
שוק: ${f.market || 'לא צוין'}
הכנסות: ${f.revenue || 'לא צוין'}
משאבים: ${f.resources || 'לא צוין'}
זמן: ${f.timeline || 'לא צוין'}

JSON:
{"failure_probability":<0-100>,"verdict":"<1 משפט>","fatal_risks":[{"title":"<שם>","severity":<1-3>,"explanation":"<משפט>"}],"failure_scenario":"<2 משפטים>","competitor_response":"<משפט>","critical_fixes":["<תיקון>","<תיקון>","<תיקון>"],"one_thing":"<משפט>"}

3 סיכונות בלבד. קצר וספציפי.`;

      try {
        const resp = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system: 'You are a brutally honest business analyst. Respond ONLY with valid JSON, no markdown, no backticks.',
            messages: [{ role: 'user', content: userPrompt }]
          })
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error.message);
        // Handle both response formats
        if (data.result) {
          state.result = data.result;
        } else {
          const text = (data.content?.[0]?.text || '').replace(/```json|```/g,'').trim();
          const jsonMatch = text.match(/\{[\s\S]*\}/);
          state.result = JSON.parse(jsonMatch ? jsonMatch[0] : text);
        }
        state.view = 'result';
      } catch(e) {
        state.view = 'form';
        state.error = 'שגיאה בניתוח. בדוק את החיבור ונסה שנית.';
      }
      render();
    }

    render();
  </script>
</body>
</html>
